<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Coding Tutor • Motion Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-card: rgba(26, 34, 52, 0.7);
      --border-card: rgba(45, 58, 88, 0.6);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --text-body: #cbd5e1;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --violet: #8b5cf6;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Video-like ambient mesh background */
    .ambient-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      animation: floatMotion 20s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
    }
    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 55vw;
      height: 55vw;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      animation-delay: -7s;
    }
    .blob-3 {
      top: 30%;
      left: 40%;
      width: 35vw;
      height: 35vw;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      animation-delay: -14s;
    }

    @keyframes floatMotion {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, 60px) scale(1.1); }
      100% { transform: translate(-60px, -40px) scale(0.95); }
    }

    /* Top Progress Bar */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 100;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #10b981, #8b5cf6);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Main Stage */
    .stage {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 60px 80px 60px;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1400px;
      height: 100%;
      max-height: 820px;
      position: relative;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.96) translateY(20px);
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    /* Header styling */
    .slide-header {
      margin-bottom: 24px;
    }
    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .slide-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-white);
      line-height: 1.2;
    }
    .slide-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Card Layouts */
    .slide-content {
      flex: 1;
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(6, 182, 212, 0.5);
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-accent, var(--cyan));
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-white);
    }
    .card-badge {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--card-accent, var(--cyan));
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-list li {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-body);
      position: relative;
      padding-left: 20px;
    }
    .card-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--card-accent, var(--cyan));
      font-weight: bold;
      font-size: 1.2rem;
      line-height: 1;
    }

    /* Stat Cards */
    .stat-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-card {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .stat-val {
      font-size: 2.5rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--stat-col, var(--emerald));
      line-height: 1.1;
    }
    .stat-lbl {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 6px;
    }
    .stat-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 4-Step Process layout */
    .step-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 100%;
    }
    .step-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--step-color, var(--cyan));
      margin-bottom: 12px;
    }
    .step-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 10px;
    }
    .step-desc {
      font-size: 0.88rem;
      color: var(--text-body);
      line-height: 1.5;
    }

    /* Hero Slide */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
      background: radial-gradient(circle at center, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
      border-radius: 28px;
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    .hero-title {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 40%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .hero-sub {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--emerald);
      margin-bottom: 28px;
    }
    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .tag-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #c4b5fd;
    }

    /* Bottom Control Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 100;
    }

    .brand-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-nav:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .btn-nav.active {
      background: var(--cyan);
      color: #0b0f19;
      border-color: var(--cyan);
    }

    .counter-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cyan);
      padding: 0 12px;
    }

    /* Slide Thumbnails Drawer */
    .drawer {
      position: absolute;
      bottom: 64px;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 30px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      z-index: 90;
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .drawer.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .thumb-item {
      flex: 0 0 160px;
      height: 90px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .thumb-item:hover, .thumb-item.active {
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
      transform: scale(1.04);
    }
    .thumb-num {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--cyan);
    }
    .thumb-title {
      font-size: 0.75rem;
      color: var(--text-white);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      font-weight: 600;
      line-height: 1.2;
    }
  </style>
</head>

        const osc = audioCtx.createOscillator();

        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.start();

              </div>
              <div class="glass-card" style="flex:1; --card-accent: ${s.card3.accent};">
                <div class="card-header">
                  <div class="card-title">${s.card3.title}</div>
                  <div class="card-badge">${s.card3.badge}</div>
                </div>
                <ul class="card-list">
                  ${s.card3.items.map(i => `<li>${i}</li>`).join('')}
                </ul>
              </div>
            </div>
          `;
        } else if (s.layout === 'four_steps') {
          slideEl.innerHTML = `
            <div class="slide-header">
              <div class="category-badge">${s.category}</div>
              <h2 class="slide-title">${s.title}</h2>
              <div class="slide-subtitle">${s.subtitle}</div>
            </div>
            <div class="step-grid">
              ${s.steps.map(st => `
                <div class="step-card" style="--step-color: ${st.color};">
                  <div class="step-num">${st.num}</div>
                  <div class="step-title">${st.title}</div>
                  <div class="step-desc">${st.desc}</div>
                </div>
              `).join('')}
            </div>
          `;
        } else if (s.layout === 'stats_plus_card') {
          slideEl.innerHTML = `
            <div class="slide-header">
              <div class="category-badge">${s.category}</div>
              <h2 class="slide-title">${s.title}</h2>
              <div class="slide-subtitle">${s.subtitle}</div>
            </div>
            <div class="stat-row">
              <div class="stat-card" style="--stat-col: ${s.stat1.col};">
                <div class="stat-val">${s.stat1.val}</div>
                <div class="stat-lbl">${s.stat1.lbl}</div>
                <div class="stat-sub">${s.stat1.sub}</div>
              </div>
              <div class="stat-card" style="--stat-col: ${s.stat2.col};">
                <div class="stat-val">${s.stat2.val}</div>
                <div class="stat-lbl">${s.stat2.lbl}</div>
                <div class="stat-sub">${s.stat2.sub}</div>
              </div>
              <div class="stat-card" style="--stat-col: ${s.stat3.col};">
                <div class="stat-val">${s.stat3.val}</div>
                <div class="stat-lbl">${s.stat3.lbl}</div>
                <div class="stat-sub">${s.stat3.sub}</div>
              </div>
            </div>
            <div class="glass-card" style="--card-accent: ${s.main_card.accent};">
              <div class="card-header">
                <div class="card-title">${s.main_card.title}</div>
                <div class="card-badge">${s.main_card.badge}</div>
              </div>
              <ul class="card-list">
                ${s.main_card.items.map(i => `<li>${i}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        viewport.appendChild(slideEl);

        // Thumbnail Drawer Item
        const thumb = document.createElement('div');
        thumb.className = 'thumb-item' + (idx === 0 ? ' active' : '');
        thumb.id = `thumb-${idx}`;
        thumb.innerHTML = `
          <div class="thumb-num">SLIDE ${String(idx + 1).padStart(2, '0')}</div>
          <div class="thumb-title">${s.title}</div>
        `;
        thumb.onclick = () => goToSlide(idx);
        drawer.appendChild(thumb);
      });

      updateNavigation();
    }

    function goToSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      playBeep(520, 0.05);

      document.querySelectorAll('.slide').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));

      currentIndex = index;
      const targetSlide = document.getElementById(`slide-${currentIndex}`);
      const targetThumb = document.getElementById(`thumb-${currentIndex}`);

      if (targetSlide) targetSlide.classList.add('active');
      if (targetThumb) {
        targetThumb.classList.add('active');
        targetThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      updateNavigation();
    }

    function updateNavigation() {
      const percent = ((currentIndex + 1) / slidesData.length) * 100;
      progressBar.style.width = percent + '%';
      counterDisplay.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(slidesData.length).padStart(2, '0')}`;
    }

    function nextSlide() {
      if (currentIndex < slidesData.length - 1) {
        goToSlide(currentIndex + 1);
      } else if (autoplayInterval) {
        goToSlide(0); // Loop in autoplay
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    function toggleAutoplay() {
      if (autoplayInterval) {
        clearInterval(autoplayInterval);
        autoplayInterval = null;
        btnAutoplay.classList.remove('active');
        btnAutoplay.innerHTML = '▶ Auto-Play (Video)';
      } else {
        btnAutoplay.classList.add('active');
        btnAutoplay.innerHTML = '⏸ Tạm dừng';
        playBeep(750, 0.08);
        autoplayInterval = setInterval(() => {
          nextSlide();
        }, 6500); // 6.5s per slide like a video
      }
    }

    // Event Listeners
    document.getElementById('btnNext').onclick = nextSlide;
    document.getElementById('btnPrev').onclick = prevSlide;
    btnAutoplay.onclick = toggleAutoplay;

    document.getElementById('btnDrawer').onclick = () => {
      drawer.classList.toggle('open');
      playBeep(450, 0.04);
    };

    document.getElementById('btnFullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key.toLowerCase() === 'p') {
        toggleAutoplay();
      } else if (e.key.toLowerCase() === 'm') {
        drawer.classList.toggle('open');
      } else if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    // Initialize
    renderSlides();
  </script>
</body>
</html>
